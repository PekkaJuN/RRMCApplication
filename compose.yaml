name: rrmc

services:
  backend:
    build: ./backend
    # prestart exits non-zero on invalid settings or a failed migration, which stops the
    # container; Uvicorn's reloader would otherwise keep it running.
    command: >-
      sh -c "python -m app.prestart
      && exec uvicorn --factory app.main:create_app
      --host 0.0.0.0 --port 8000 --reload --no-access-log"
    env_file:
      - path: ${RRMC_ENV_FILE:-.env}
        required: true
    environment:
      # File events from Windows folders do not reach the container; poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${RRMC_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ${RRMC_IMPORT_DIR:-./source/import}:/data/import
      - ${RRMC_DONE_DIR:-./source/import_done}:/data/import_done
      - ${RRMC_FAILED_DIR:-./source/import_failed}:/data/import_failed
      # Images of archived years; the user deletes them here by hand (archiving spec PC5).
      - ${RRMC_ARCHIVE_DIR:-./source/archived}:/data/archived
      # SQLite locking is unreliable on folders shared from Windows; keep it in a volume.
      - rrmc-data:/data/db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    command: npm run dev
    env_file:
      - path: ${RRMC_ENV_FILE:-.env}
        required: true
    environment:
      VITE_API_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:${RRMC_UI_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Keeps the Linux node_modules of the image apart from the Windows folder.
      - rrmc-node-modules:/app/node_modules

  # Test, lint, type check and audit commands: `docker compose run --rm backend-test pytest`.
  # They never see real data: no import folders, no rrmc-data, no settings file, and /data is
  # a temporary filesystem (specs/features/test-isolation.md). The image is the app's own.
  backend-test:
    profiles: [test]
    build: ./backend
    image: rrmc-backend
    environment:
      RRMC_ENGINES: fake
    volumes:
      - ./backend:/app
    tmpfs:
      - /data

  # Frontend checks: `docker compose run --rm frontend-test npm test`. No settings file.
  frontend-test:
    profiles: [test]
    build: ./frontend
    image: rrmc-frontend
    volumes:
      - ./frontend:/app
      - rrmc-node-modules:/app/node_modules

  # E2E tests: `docker compose --profile e2e run --rm e2e`.
  backend-e2e:
    profiles: [e2e]
    build: ./backend
    # /data is a temporary filesystem, so the folders are created here and the database
    # starts empty on every run.
    command: >-
      sh -c "mkdir -p /data/import /data/import_done /data/import_failed /data/archived
      && python -m app.prestart
      && exec uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8000 --no-access-log"
    # No settings file: every setting but the engines takes its default
    # (specs/features/test-isolation.md, PC6).
    environment:
      RRMC_ENGINES: fake
    volumes:
      - ./backend:/app
      # Test-only import folder, shared with the e2e container, which writes synthetic images
      # into it. It is never the real import folder.
      - rrmc-e2e-import:/data/import
      # Test-only failed folder, shared the same way for the new receipt form
      # (receipt-management P7). It is never the real failed folder.
      - rrmc-e2e-failed:/data/import_failed
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 2s
      retries: 30

  e2e:
    profiles: [e2e]
    build: ./frontend
    command: npx playwright test
    environment:
      VITE_API_TARGET: http://backend-e2e:8000
      E2E_IMPORT_DIR: /e2e-import
      E2E_FAILED_DIR: /e2e-failed
    volumes:
      - ./frontend:/app
      - rrmc-node-modules:/app/node_modules
      - rrmc-e2e-import:/e2e-import
      - rrmc-e2e-failed:/e2e-failed
    depends_on:
      backend-e2e:
        condition: service_healthy

  # Model evaluation on the user's own receipts (specs/features/model-evaluation.md):
  # `docker compose --profile eval run --rm eval python -m evaluation run --variant ...`.
  # No ports; it calls only RRMC_OLLAMA_URL.
  eval:
    profiles: [eval]
    build: ./backend
    env_file:
      - path: ${RRMC_ENV_FILE:-.env}
        required: true
    volumes:
      - ./backend:/app
      - ${RRMC_EVAL_DIR:-./source/eval}:/data/eval
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  rrmc-data:
  rrmc-node-modules:
  rrmc-e2e-import:
  rrmc-e2e-failed:
