[project]
name = "rrmc-backend"
version = "0.1.0"
description = "RRMCApplication backend: receipt reading, categorization and totals"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx2>=2.16",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.uv]
# The backend is an application run from the mounted source folder, not an installed package.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "N"]

[tool.ruff.lint.per-file-ignores]
# pytest uses plain assert statements.
"tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["app", "evaluation", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests that need a real engine run only when asked for: pytest -m tesseract
addopts = "-m 'not tesseract'"
markers = [
    "tesseract: needs the real Tesseract in the backend image",
]
